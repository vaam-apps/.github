# Static analysis for code and for documentation.
#
# Two halves, because "SAST for docs" is a different question from SAST for
# code and no single tool answers both:
#
#   code  — CodeQL, one analysis per language.
#   docs  — link integrity. A documentation set that confidently points at a
#           dead or hijacked URL is a real defect, and the only one a reader
#           cannot detect by reading. Secret-in-docs is covered by trivy.yml's
#           secret scanner, which walks every file including Markdown, so it is
#           deliberately not duplicated here.
#
# build-mode is `none` for every language this org uses. CodeQL analyses Rust,
# JS/TS and Actions from source, so nothing is compiled here — which matters:
# a build-mode of autobuild on vsms would spend five minutes rebuilding a
# workspace that ci.yml has already built.
name: SAST (reusable)

on:
  workflow_call:
    inputs:
      # See "Choosing a runner" in the README for why this exists, and for
      # what a non-default value has to look like.
      runner:
        description: "Runner label for this workflow's jobs. A single label only, not a JSON array."
        type: string
        required: false
        default: ubuntu-latest
      codeql-languages:
        description: 'JSON array, e.g. ["rust","javascript-typescript","actions"]. Empty disables CodeQL.'
        type: string
        required: false
        default: "[]"
      docs-globs:
        description: "Newline-separated globs to link-check. Empty disables the docs job."
        type: string
        required: false
        default: ""
      fail-on-broken-links:
        description: "Fail the docs job on a broken link, rather than only annotating."
        type: boolean
        required: false
        default: false
    secrets:
      app-client-id:
        required: true
      app-private-key:
        required: true

permissions: {}

jobs:
  codeql:
    if: inputs.codeql-languages != '[]'
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql-languages) }}
    steps:
      # Minted inline, not via a local composite action: `uses: ./…` inside a
      # REUSABLE workflow resolves against the caller's checkout, not this
      # repository, so a shared composite here would break every consumer.
      # Six duplicated lines beat a mechanism that resolves somewhere else.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          token: ${{ steps.app.outputs.token }}

      # upload: false, then upload by hand — for the same reason as trivy.yml.
      # analyze's own upload PUTs to /code-scanning/analysis, an Actions-internal
      # endpoint that refuses a GitHub App installation token with 404. The
      # public POST /code-scanning/sarifs accepts it. The category is baked into
      # the SARIF's automationDetails by analyze, so it survives the hand-off.
      - uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          category: /language:${{ matrix.language }}
          upload: false
          output: sarif-results

      - name: Upload SARIF as the App
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          REF: ${{ github.event.pull_request.head.ref && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for f in sarif-results/*.sarif; do
            found=1
            payload=$(jq -nc --arg sha "$SHA" --arg ref "$REF" \
              --arg sarif "$(gzip -c "$f" | base64 -w0)" \
              '{commit_sha:$sha, ref:$ref, sarif:$sarif, tool_name:"CodeQL"}')
            code=$(curl -sS -o /tmp/u.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs" \
              --data-binary @- <<<"$payload")
            if [ "$code" != "202" ]; then
              echo "::error title=CodeQL::$f upload returned HTTP $code"; cat /tmp/u.json; exit 1
            fi
            echo "::notice title=CodeQL::$f accepted ($(jq -r .id /tmp/u.json))"
          done
          if [ "$found" = "0" ]; then
            echo "::error title=CodeQL::analyze produced no SARIF in sarif-results/"; exit 1
          fi


  docs:
    if: inputs.docs-globs != ''
    name: Docs — link integrity
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --include-fragments --max-retries 2
            --exclude-path node_modules --exclude-path target
            ${{ inputs.docs-globs }}
          fail: ${{ inputs.fail-on-broken-links }}
          # lychee's own token use is read-only rate-limit relief on github.com
          # links; GITHUB_TOKEN is correct and sufficient here, and using the
          # App would grant it more than a link checker should ever hold.
          token: ${{ github.token }}
