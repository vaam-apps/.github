# Super-linter, deliberately scoped to what nothing else in this org lints.
#
# It does NOT lint Rust or JS/TS. Those already have clippy/rustfmt and biome,
# configured per repo, faster, and authoritative. Two auto-fixers on one file
# do not converge — they fight, and the commit log records the argument. So
# super-linter owns only the gaps: Markdown, YAML, JSON, Dockerfile, shell,
# and workflow security.
#
# VALIDATE_GITHUB_ACTIONS_ZIZMOR is the one people skip and shouldn't: it is
# SAST for workflows themselves — template-injection through `${{ }}` in a
# `run:` body, over-broad permissions, unpinned actions. Everything this org
# has been fixing by hand.
name: Lint (reusable)

on:
  workflow_call:
    inputs:
      fix:
        description: "Apply fixes and push them back to the PR branch."
        type: boolean
        required: false
        default: true
      validate-all:
        description: "Lint the whole tree rather than only files the PR changed."
        type: boolean
        required: false
        default: false
      filter-regex-exclude:
        description: "Regex of paths to skip entirely (generated code, vendored files)."
        type: string
        required: false
        default: ""
    secrets:
      app-client-id:
        required: true
      app-private-key:
        required: true

permissions: {}

jobs:
  lint:
    name: Super-linter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      # A fork PR gets a read-only token and no secrets, so there is no token
      # that could push to the fork's branch even in principle. Rather than
      # fail, such a PR is linted in report-only mode and says so. Silently
      # "succeeding" while fixing nothing is the failure mode to avoid.
      - name: Decide whether fixes can be pushed
        id: mode
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          WANT_FIX: ${{ inputs.fix }}
        run: |
          if [ "$WANT_FIX" != "true" ]; then
            echo "fix=false" >>"$GITHUB_OUTPUT"; echo "reason=disabled by caller" >>"$GITHUB_OUTPUT"
          elif [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
            echo "fix=false" >>"$GITHUB_OUTPUT"; echo "reason=fork PR — no writable token exists for $HEAD_REPO" >>"$GITHUB_OUTPUT"
          else
            echo "fix=true" >>"$GITHUB_OUTPUT"; echo "reason=same-repo branch" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        if: steps.mode.outputs.fix == 'true'
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}

      # Check out the DEFAULT ref — for a pull_request that is GitHub's
      # synthetic merge commit, and super-linter requires it: it diffs against
      # that SHA to decide which files changed. Checking out the head branch
      # instead makes the merge SHA unreachable and super-linter aborts with
      # "The SHA_REFERENCE reference (…) doesn't exist in this Git repository".
      #
      # The fixes are then replayed onto the real head commit below, rather
      # than committed here on top of the merge — which would quietly pull the
      # base branch into someone's PR as a side effect of a formatting run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate-all }}
          FILTER_REGEX_EXCLUDE: ${{ inputs.filter-regex-exclude }}
          SAVE_SUPER_LINTER_SUMMARY: true
          # Super-linter posts a PR summary comment by default, which needs
          # pull-requests: write. Granting that would mean editing every caller
          # in the org for a comment the job summary already shows, so the
          # comment is off and the step summary stays on.
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true

          # --- the gaps, and only the gaps ---
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_BASH: true
          # shfmt is a separate linter from shellcheck, and super-linter refuses
          # to start if FIX_SHELL_SHFMT is set while its own validator is off:
          # "Cannot set FIX_SHELL_SHFMT to true when VALIDATE_SHELL_SHFMT is false".
          VALIDATE_SHELL_SHFMT: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true

          # --- fixes, where the tool can apply one safely ---
          # Only fixes whose matching VALIDATE_ is enabled above. Super-linter
          # treats a mismatch as a fatal configuration error, not a warning.
          FIX_MARKDOWN: ${{ steps.mode.outputs.fix }}
          FIX_JSON: ${{ steps.mode.outputs.fix }}
          FIX_SHELL_SHFMT: ${{ steps.mode.outputs.fix }}

      - name: Commit fixes onto the PR branch
        if: steps.mode.outputs.fix == 'true'
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Decide on TRACKED, unstaged modifications only — which is exactly
          # what super-linter's fixes are. `git status --porcelain` also reports
          # untracked files, and super-linter writes its own summary directory
          # into the workspace, so gating on that saw "changes", produced an
          # empty `git diff` patch, and failed with a message about rebasing
          # that had nothing to do with the actual cause.
          if git diff --quiet; then
            echo "nothing to fix"; exit 0
          fi

          # Replay the fixes onto the real head commit. fetch-depth: 0 on the
          # merge ref already brought the head commit in — it is one of the
          # merge's parents — so no extra fetch is needed.
          git diff > /tmp/superlinter-fixes.patch
          git checkout -q -B superlinter-fixes "$HEAD_SHA"
          if ! git apply --3way /tmp/superlinter-fixes.patch; then
            echo "::error title=Lint::Fixes would not apply cleanly onto the PR head commit."
            echo "The patch was non-empty, so this is a real conflict: the base branch"
            echo "changed one of the same files. Rebase the PR and re-run."
            exit 1
          fi

          git config user.name  "vaam-apps[bot]"
          git config user.email "vaam-apps[bot]@users.noreply.github.com"
          # -a, never `add -A`: the latter would sweep super-linter's own output
          # directory into the commit alongside the fixes.
          git commit -qam "style: apply super-linter fixes" \
            -m "Markdown, JSON, YAML and shell formatting only. Rust and JS/TS formatting belong to this repository's own clippy and biome configuration."
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${HEAD_REF}"
          echo "::notice title=Lint::Pushed formatting fixes. This re-triggers CI once; the next run finds nothing to fix and pushes nothing."

      - name: Report-only, and why
        if: steps.mode.outputs.fix != 'true'
        run: echo "::notice title=Lint::Report-only (${{ steps.mode.outputs.reason }}). Findings above were not auto-fixed."
