# Trivy filesystem scan: dependency vulnerabilities, leaked secrets, and IaC
# misconfiguration.
#
# On the Rust repos the vulnerability half overlaps `cargo deny`, which already
# runs there and is stricter about licences and bans. The parts that are NOT
# already covered, and the reason this exists:
#
#   misconfig — Dockerfiles, compose files, Helm charts. Nothing else looks at
#               these, and every repo here ships containers.
#   secret    — walks every file, documentation included, which is the other
#               half of "SAST for docs".
name: Trivy (reusable)

on:
  workflow_call:
    inputs:
      scanners:
        type: string
        required: false
        default: "vuln,secret,misconfig"
      severity:
        description: "Severities that fail the job. Everything found is still uploaded."
        type: string
        required: false
        default: "CRITICAL,HIGH"
      skip-dirs:
        type: string
        required: false
        default: "**/node_modules,**/target,**/.git"
      upload-sarif:
        description: >-
          Upload findings to code scanning. Must be false on a private repo
          without GitHub Advanced Security: code scanning is a GHAS feature
          there, so the upload fails outright. The job still gates on severity,
          it just reports in the log instead of the Security tab.
        type: boolean
        required: false
        default: true
    secrets:
      app-client-id:
        required: true
      app-private-key:
        required: true

permissions: {}

jobs:
  scan:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two runs on purpose. The first must not fail, or a CRITICAL finding
      # would abort the job before its own SARIF reached code scanning — you
      # would be told something is wrong and not what.
      - name: Scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: ${{ inputs.scanners }}
          skip-dirs: ${{ inputs.skip-dirs }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      # Uploaded with a direct API call, not github/codeql-action/upload-sarif.
      #
      # That action does not use the public SARIF endpoint: it PUTs to
      # /repos/:owner/:repo/code-scanning/analysis, an Actions-internal route
      # that does not accept a GitHub App installation token and answers 404.
      # No permission grant changes that — it is the wrong credential class for
      # that endpoint, not an under-privileged one.
      #
      # The public POST /code-scanning/sarifs accepts the App token and creates
      # a real analysis (verified: HTTP 202 with both the App token and
      # GITHUB_TOKEN, side by side in one job). So the org requirement that
      # everything authenticate as the App is met by calling the documented
      # endpoint directly.
      #
      # What is given up versus the action: client-side SARIF validation, the
      # fingerprint injection that de-duplicates alerts across runs, and the
      # processing-status wait. Findings still reach the Security tab.
      - name: Upload SARIF as the App
        if: inputs.upload-sarif
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          REF: ${{ github.event.pull_request.head.ref && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg sha "$SHA" --arg ref "$REF" \
            --arg sarif "$(gzip -c trivy.sarif | base64 -w0)" \
            '{commit_sha:$sha, ref:$ref, sarif:$sarif, tool_name:"Trivy"}')

          code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs" \
            --data-binary @- <<<"$payload")

          if [ "$code" != "202" ]; then
            echo "::error title=Trivy::SARIF upload returned HTTP $code"
            cat /tmp/upload.json
            exit 1
          fi
          echo "::notice title=Trivy::SARIF accepted ($(jq -r .id /tmp/upload.json))"

      - name: Gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: ${{ inputs.scanners }}
          skip-dirs: ${{ inputs.skip-dirs }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          format: table
          exit-code: "1"

