# Trivy filesystem scan: dependency vulnerabilities, leaked secrets, and IaC
# misconfiguration.
#
# On the Rust repos the vulnerability half overlaps `cargo deny`, which already
# runs there and is stricter about licences and bans. The parts that are NOT
# already covered, and the reason this exists:
#
#   misconfig — Dockerfiles, compose files, Helm charts. Nothing else looks at
#               these, and every repo here ships containers.
#   secret    — walks every file, documentation included, which is the other
#               half of "SAST for docs".
name: Trivy (reusable)

on:
  workflow_call:
    inputs:
      scanners:
        type: string
        required: false
        default: "vuln,secret,misconfig"
      severity:
        description: "Severities that fail the job. Everything found is still uploaded."
        type: string
        required: false
        default: "CRITICAL,HIGH"
      skip-dirs:
        type: string
        required: false
        default: "**/node_modules,**/target,**/.git"
      upload-sarif:
        description: >-
          Upload findings to code scanning. Must be false on a private repo
          without GitHub Advanced Security: code scanning is a GHAS feature
          there, so the upload fails outright. The job still gates on severity,
          it just reports in the log instead of the Security tab.
        type: boolean
        required: false
        default: true
    secrets:
      app-client-id:
        required: true
      app-private-key:
        required: true

permissions: {}

jobs:
  scan:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}

      # TEMPORARY DIAGNOSTIC. The upload 404s while a user token gets 422 on the
      # same endpoint, so the repository is fine and the App token is not. This
      # asks the token directly, because nothing else can: an installation token
      # cannot be minted outside a workflow without handling the private key.
      - name: What can this token actually reach?
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          probe() {
            printf '  %-46s %s\n' "$1" \
              "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
                 -H 'Accept: application/vnd.github+json' "${@:2}")"
          }
          probe "GET /installation/repositories"  https://api.github.com/installation/repositories
          probe "GET this repo"                   "https://api.github.com/repos/${GITHUB_REPOSITORY}"
          probe "GET code-scanning/analyses"      "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/analyses"
          probe "POST code-scanning/sarifs (422 = ok)" -X POST -d '{}' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs"
          # codeql-action also reads the workflow run it is uploading for, which
          # needs the Actions permission. The App does not hold it, and GitHub
          # answers an unauthorised App with 404 rather than 403 — which is
          # exactly the Not Found the upload reports.
          probe "GET actions/runs/<this run>"     "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "  --- app identity behind this token ---"
          curl -s -H "Authorization: Bearer $TOKEN" https://api.github.com/installation/repositories \
            | head -c 200 || true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two runs on purpose. The first must not fail, or a CRITICAL finding
      # would abort the job before its own SARIF reached code scanning — you
      # would be told something is wrong and not what.
      - name: Scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: ${{ inputs.scanners }}
          skip-dirs: ${{ inputs.skip-dirs }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        if: inputs.upload-sarif
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
          token: ${{ steps.app.outputs.token }}
          # The upload itself works — an analysis lands on the PR ref every time.
          # What 404s is the processing poll the action runs afterwards, and it
          # reports that as a token-permission error, which it is not: the same
          # token passes every probe including POST to this very endpoint.
          # Not waiting means the findings still reach the Security tab; we just
          # do not block the job on GitHub finishing its own ingestion.
          wait-for-processing: false

      - name: Gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: ${{ inputs.scanners }}
          skip-dirs: ${{ inputs.skip-dirs }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Explain an upload failure
        if: failure()
        run: |
          echo "::error title=Trivy::SARIF upload failed. Two different causes look alike here:"
          echo "  'Not Found' (404)  -> the App token did not resolve. Check the App holds"
          echo "                        Code scanning alerts: write, AND that the installation"
          echo "                        approved it — changing the App only requests it."
          echo "  'Resource not accessible by integration' (403) -> permission genuinely absent." 
